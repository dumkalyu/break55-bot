name: Итоги дня

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC = 01:30 мск, со вторника по субботу
  workflow_dispatch: {}        # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write

concurrency:
  group: bot-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Итоги дня
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: python scanner.py
      - name: Сохранить состояние
        if: always()
        run: |
          git config user.name "break55-bot"
          git config user.email "break55-bot@users.noreply.github.com"
          for f in bot_state.json paper_journal.csv bot_offset.txt; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || (git commit -m "итоги $(date -u +%F)" && git pull --rebase && git push)
